name: Deploy Flutter Web

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout code
      - uses: actions/checkout@v4

      # 2. Set up Flutter
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: stable

      # 3. Inject API key
      - name: Inject API Key
        run: |
          mkdir -p lib
          echo "const String HUGGINGFACE_API_KEY = '${{ secrets.HUGGINGFACE_API_KEY }}';" > lib/api_key.dart

      # 4. Get dependencies
      - name: Flutter pub get
        run: flutter pub get

      # 5. Build Flutter web
      - name: Build Flutter web
        run: flutter build web --release --base-href="/Medi/"

      # 6. Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          path: build/web
